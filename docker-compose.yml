version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pathiq-postgres
    restart: always
    environment:
      POSTGRES_USER: pathiq
      POSTGRES_PASSWORD: pathiq_password
      POSTGRES_DB: pathiq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pathiq-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: pathiq-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: pathiq-mailhog
    restart: always
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  sandbox-runner:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    container_name: pathiq-sandbox
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pathiq-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://pathiq:pathiq_password@postgres:5432/pathiq_db?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: pathiq-assets
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      EMAIL_DRIVER: mailhog
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
      - minio
      - mailhog

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pathiq-worker
    command: npm run worker
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pathiq:pathiq_password@postgres:5432/pathiq_db?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pathiq-client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
